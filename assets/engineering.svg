<svg xmlns="http://www.w3.org/2000/svg"
     width="960" height="300" viewBox="0 0 960 300">

  <style>
    .box {
      fill: none;
      stroke: #52525b;
      stroke-width: 1;
    }

    .title {
      font: 600 17px system-ui, sans-serif;
      fill: #c4b5fd;
    }

    .body {
      font: 15px system-ui, sans-serif;
      fill: #a1a1aa;
    }
  </style>

  <!-- Understand -->
  <path class="box"
        d="M32 30H48 M264 30H464V132H32V30"/>

  <text x="60" y="36" class="title">Understand the problem</text>

  <text x="52" y="72" class="body">
    <tspan x="52">Ask the right questions before</tspan>
    <tspan x="52" dy="24">choosing the tools.</tspan>
  </text>

  <!-- Simplify -->
  <path class="box"
        d="M496 30H512 M644 30H928V132H496V30"/>

  <text x="524" y="36" class="title">Keep it simple</text>

  <text x="516" y="72" class="body">
    <tspan x="516">Build what’s needed. Question what</tspan>
    <tspan x="516" dy="24">adds unnecessary complexity.</tspan>
  </text>

  <!-- Maintain -->
  <path class="box"
        d="M32 174H48 M234 174H464V276H32V174"/>

  <text x="60" y="180" class="title">Make change easier</text>

  <text x="52" y="216" class="body">
    <tspan x="52">Leave clear intent and code the</tspan>
    <tspan x="52" dy="24">next engineer can work with.</tspan>
  </text>

  <!-- Own -->
  <path class="box"
        d="M496 174H512 M658 174H928V276H496V174"/>

  <text x="524" y="180" class="title">Own the result</text>

  <text x="516" y="216" class="body">
    <tspan x="516">Shipping includes understanding</tspan>
    <tspan x="516" dy="24">what happens after release.</tspan>
  </text>
</svg>
